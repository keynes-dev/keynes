<!doctype html>
<html lang="en">

<title>Conveyor belt</title>
<style>
  html, body { margin: 0; height: 100%; background: #ffffff; }
  body { display: grid; place-items: center; min-height: 100vh; }
  #scene { width: 512px; height: 512px; max-width: 100vmin; max-height: 100vmin; aspect-ratio: 1 / 1; }
  #scene canvas { display: block; width: 100% !important; height: 100% !important; }
</style>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.185.1/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.185.1/examples/jsm/"
  }
}
</script>
</head>
<body>
<div id="scene"></div>
<script type="module">
/*
  Conveyor belt shape sorter, isometric hidden-line drafting style.

  Three upright glass tubes (cubes, pyramids, spheres) stand in a row along
  the belt axis. Each empties into an opaque curved duct that carries the
  shape out of sight into the machine, which dispenses it from a single
  nozzle. Every box is the same closed cube with a hole in its lid: square,
  triangle, or circle. The box under the nozzle receives the shape that fits
  its hole.

  The whole scene is a pure function of loop time, so it never drifts and the
  frame at t = LOOP matches the frame at t = 0 exactly.

  One box in the loop arrives with a hole the machine can no longer fill, so
  the lamp goes red, a pincer arm rolls the box over to present a face it can
  fill, the lamp goes green, and the run continues. The lamp carries the
  verdict on the box that has arrived, not on each shape dropped: amber while
  the belt is running, then red or green, and solid either way. Every tube holds a single charge,
  and all three refill together once the loop has emptied them.

  Extension point: window.conveyor.sequence is one entry per box in belt
  order. `dispense` is the shape that ends up in the box, and `reject` marks
  the box the arm has to turn first.
*/
import * as THREE from "three";
import { LineSegments2 } from "three/addons/lines/LineSegments2.js";
import { LineSegmentsGeometry } from "three/addons/lines/LineSegmentsGeometry.js";
import { LineMaterial } from "three/addons/lines/LineMaterial.js";
import { mergeGeometries } from "three/addons/utils/BufferGeometryUtils.js";
import { SVGLoader } from "three/addons/loaders/SVGLoader.js";

const CONFIG = {
  sequence: [
    { dispense: 0 },
    { dispense: 1, reject: true },
    { dispense: 2 },
  ],
  phase: { travel: 1.2, settle: 0.4, reject: 0.6, drop: 1.0, hold: 0.4 },
  arm: { descend: 0.4, grip: 0.2, turn: 0.7, release: 0.2, retract: 0.4 },
  itemsPerDrop: 3,
  tubeCapacity: 3,
  releaseStagger: 0.2,
  ductTransit: 0.18,
  manifoldDelay: 0.06,
  refillStart: 0.06,
  refillStagger: 0.26,
  gravity: 24,
  restitution: 0.15,
  // White, like every other surface here, and told apart by their outlines the
  // way every other solid in the drawing is. Nothing in the scene carries colour
  // now except the lamp.
  shapeColors: [0xffffff, 0xffffff, 0xffffff],
  // Keyed by meaning rather than by colour, so the palette can be retuned
  // without the names lying.
  lampColors: { running: 0xf2b705, denied: 0xe3262e, approved: 0x18b85a },
  lineWidth: 1.25, fineWidth: 0.55, markWidth: 0.4,
  maxPixelRatio: 2,
  frustum: 2.9,
  skyMargin: 1.15,
  // Raised until the furthest tube's top rim clears the frame. It is the rim
  // that decides, not the axis: the tube nearest the top of frame projects its
  // far lip higher than its centre line, and checking the centre alone lets the
  // lip clip.
  lookAt: [0, 2.36, 0],
};
window.conveyor = CONFIG;

// A rejected box costs an extra beat, so cycles are not all the same length
// and the loop is a schedule rather than a fixed multiple.
const ARM_TIME = CONFIG.arm.descend + CONFIG.arm.grip + CONFIG.arm.turn + CONFIG.arm.release + CONFIG.arm.retract;
const CYCLES = CONFIG.sequence.map((entry) => {
  const lead = CONFIG.phase.travel + CONFIG.phase.settle + (entry.reject ? CONFIG.phase.reject + ARM_TIME : 0);
  const armStart = CONFIG.phase.travel + CONFIG.phase.settle + CONFIG.phase.reject;
  // When the box under the nozzle becomes one the machine can fill: as soon as
  // the belt stops for a box it can already fill, or the moment the arm finishes
  // rolling one it cannot. This is what the lamp reads.
  const approved = entry.reject ? armStart + CONFIG.arm.descend + CONFIG.arm.grip + CONFIG.arm.turn : CONFIG.phase.travel;
  return { entry, armStart, approved, dropStart: lead, length: lead + CONFIG.phase.drop + CONFIG.phase.hold, start: 0 };
});
let clock = 0;
for (const cycle of CYCLES) { cycle.start = clock; clock += cycle.length; }
const LOOP = clock;
// Which cycle spends each shape. A tube is full until its cycle, empty after.
const SPEND_CYCLE = [];
CONFIG.sequence.forEach((entry, index) => { SPEND_CYCLE[entry.dispense] = index; });
const EMERGE = CONFIG.ductTransit + CONFIG.manifoldDelay;

const BELT = {
  width: 1.6, top: 0.75, thickness: 0.25, length: 24, slot: 2.4, slots: 9,
  slat: 0.4, slatDepth: 0.3, slatRise: 0.05,
  rollerW: 1.66, rollerSpan: 7.2, rollerTeeth: 12, rollerRoot: 0.74, rollerHub: 0.34,
};
// The belt advances three slots per loop. Sizing the rollers so that distance
// is a whole number of turns keeps them from jumping at the seam.
BELT.rollerR = (BELT.slot * 3) / (2 * Math.PI * 9);
// One roller per slat. The rollers are evenly spaced whatever the pitch, but
// only this pitch looks it: the slats mask them, so at any other spacing the
// gaps between slats fall on a different beat from the rollers, which roller
// shows through changes down the run, and they read as unevenly spread.
BELT.rollerGap = BELT.slat;
const WRAP = BELT.slot * BELT.slots;
const BOX = { size: 0.8, wall: 0.06, clear: 0.01 };
BOX.center = (BOX.size - BOX.wall) / 2;

// Hole layout per box in the loop: every face bored, and every face its own
// shape. From this camera exactly three faces of a box ever show, the ones
// facing +x, +y and +z, and a box rolled half a turn about x shows a different
// three: the same +x face, its base where its lid was, and its far z face
// brought round to the near side. So both triples have to be three different
// shapes, and giving the two z faces one shape between them is what put two
// triangles on a flipped box. The -x face never shows in either stance.
// `base` is the face a turned box ends up presenting, since the arm rolls it
// right over rather than onto its side, so it carries the shape the machine
// dispenses to it.
const BOXES = [
  { top: 0, base: 2, xPos: 1, xNeg: 0, zPos: 2, zNeg: 0 },
  { top: 0, base: 1, xPos: 2, xNeg: 0, zPos: 1, zNeg: 0, turns: true },
  { top: 2, base: 1, xPos: 0, xNeg: 2, zPos: 1, zNeg: 2 },
];
// Both stances of every box show three different shapes. Worth asserting: the
// pairing is easy to break by hand and the fault only shows on the one box that
// is ever seen the other way up.
for (const b of BOXES) {
  for (const face of [[b.top, b.xPos, b.zPos], [b.base, b.xPos, b.zNeg]]) {
    if (new Set(face).size !== 3) throw new Error(`box shows a repeated shape: ${face}`);
  }
}
// Pincer arm: a jointed two-link arm mounted behind the machine, on the far
// side of the belt so it never stands between the boxes and the camera. Its
// wrist sits on the roll axis just outside the box, and the claw reaches in.
// Placement is constrained by sight lines as much as by reach: the shoulder
// and both poses are kept out of the screen area the near tube's iris covers,
// or the joints vanish behind it and the arm reads as loose parts.
const ARM = {
  shoulder: { x: -2.4, y: 2.2 },
  upper: 1.1, fore: 0.95,
  // The claw's fingers straddle the box along the belt, not across it, so they
  // pass either side of it and the claw runs straight in and straight back
  // out. Parked, the whole hand sits clear of the belt at working height.
  wristX: -0.85, parkX: -2.3, releaseLift: 0.44,

  // Links and joints. Each link is a box beam running from one pivot to the
  // next, and each joint is one stepped barrel split along its axis into a
  // slice per link: the near slice narrower, so the step between them is a
  // machined shoulder rather than a line adrift on a flat face. Because the
  // slices are coaxial and the two beams they hold sit only a short step apart
  // in depth, a joint reads as one solid part. Separating consecutive links by
  // more than the joint's own radius is what opened the gaps before: the far
  // link then projects clear of the near one and the joint comes apart.
  mountBeam: { h: 0.20, w: 0.16, z: -0.11 },
  upperBeam: { h: 0.26, w: 0.16, z: 0.11 },
  foreBeam: { h: 0.22, w: 0.14, z: -0.08 },
  shoulderJoint: { rearR: 0.29, frontR: 0.25, rear: [-0.23, 0.01], front: [-0.01, 0.23], ring: 0.13 },
  elbowJoint: { rearR: 0.24, frontR: 0.20, rear: [-0.19, 0.03], front: [-0.01, 0.23], ring: 0.11 },
  // The mount drops clear of the tubes before it reaches out, or the whole
  // attachment to the machine disappears behind the near iris.
  post: { x: -0.38, y: 2.55, h: 0.6 },
  mount: { x: -0.38, y: 2.35 },
  // Wrist: a roll actuator carried in a block on the end of the forearm, its
  // axis the arm's own reach. Everything outboard of the block is laid out in
  // sequence along that axis, so the turning shaft is never nested inside the
  // part it turns in.
  wristBlock: { l: 0.34, h: 0.34, w: 0.38, x: -0.13 },
  noseR: 0.13, noseFrom: -0.02, noseTo: 0.09, raceR: 0.085,
  collarR: 0.095, collarFrom: 0.05, collarTo: 0.13,
  flangeR: 0.16, flangeFrom: 0.13, flangeTo: 0.2, flangeRing: 0.09,
  // Pincer head. Both jaws hinge on one axle through the head block and swing
  // in the plane of the reach, closing on the box the way a pair of tongs
  // does. They are stacked in height rather than set side by side, because at
  // full close their shanks would otherwise run through each other. A shank
  // leaves the hinge almost square to the reach, so the jaw is out past the
  // box's own face before it turns forward: a shallower shank cuts the corner
  // of the box on the way in, however wide the jaws are opened.
  head: { l: 0.22, h: 0.36, w: 0.42, x: 0.31 },
  bossR: 0.09, bossFrom: 0.18, bossTo: 0.23, bossRing: 0.045,
  // The jaws are full depth rather than stacked: each shank starts a little
  // out from the axle instead of on it, so the two clear each other where they
  // cross, and the whole crossing is buried inside the head block anyway.
  hinge: 0.31, jawH: 0.28, jawT: 0.16, jawRoot: 0.09,
  shankAngle: 88, knuckleR: 0.085,
  // The finger stands off the box on its pad, so it reads as a jaw closed on
  // the box rather than as a line drawn along the box's own face.
  jawFinger: { from: 0, to: 1, z: 0.53 },
  jawPad: { l: 0.36, h: 0.18, w: 0.09, x: 0.7, z: 0.455 },
  // Shut leaves the pads a hair off the box's faces; the open angle clears
  // them by enough for the head to run in and out past a box it is not
  // gripping, jaw roots included.
  pincerOpen: 0.35,
};
const MACHINE = {
  tubeR: 0.23, tubeLen: 1.15, tubeBottomY: 3.95, tubeZ: [-1.15, 0, 1.15],
  // The elbow's bend radius also decides how much straight duct hangs below the
  // iris before the pipe turns away. At 0.44 the bend ate the whole drop and
  // there was nowhere to put a throat; at 0.24 there is a short spigot under
  // each iris for one to sit inside, and the fittings read tighter for it.
  ductR: 0.2, ductRib: 0.1, elbowR: 0.24, elbowY: 3.76, armY: 3.32,
  flangeR: 0.038, flangeW: 0.1, boltR: 0.03, bolts: 6,
  manifold: new THREE.Vector3(0, 2.9, 0), manifoldW: 0.8, manifoldH: 0.4, manifoldD: 0.78,
  nozzleTop: 2.6, nozzleBottom: 2.22, nozzleR0: 0.3, nozzleR1: 0.22,
  // The bell: tiers of a flared frustum with a stiffening rib standing proud at
  // each joint and a lip at the mouth, then flutes down the face of it.
  nozzleTiers: 3, nozzleFlare: 1.7,
  nozzleRibR: 0.024, nozzleRibH: 0.03, nozzleLipR: 0.028, nozzleLipH: 0.034,
  nozzleFlutes: 12,
  // The machine's front: one lit panel carrying the mark, with a border of lamps
  // round it, standing proud of the machine the way a marquee is bolted to the
  // front of the thing it names. Nothing behind it is in its way, but what it
  // may cover is: it is nearer the camera than the nozzle, and dropped to the
  // manifold's own height it swallows the bell whole and the shapes then fall
  // out from under the sign instead of out of a nozzle. So it sits square on
  // the machine's own centre line and takes the band between the two: its head
  // just under the iris frames, its foot just above where the bell's mouth
  // projects. That band is 0.86, and it is what caps the mark.
  signY: 3.33, signZ: 0, signW: 1.6, signH: 0.86, signT: 0.08, signInset: 0.1,
  // The lamps stand proud of the panel, so each is drawn a little further out
  // and a little lower than its seat. The border they appear to make is that
  // much tighter at the near end and along the top than the one they sit on,
  // and the mark is nudged the same way so its swash clears the top row and its
  // first letter clears the near column.
  signLogoW: 0.7, signLogoZ: -0.05, signLogoY: -0.045, signLampsW: 7, signLampsH: 3, signStay: 0.24,
  // Lamps round the sign: a socket let into the panel, a neck, and a glass
  // envelope that carries the colour. Small, because there are twenty of them.
  lampSocketR: 0.034, lampNeckR: 0.022, lampBulbR: 0.045,
};
// Iris diaphragm at the base of each tube. Every blade pivots on the frame
// ring; its inner edge is a chord whose distance from the axis is the
// aperture radius, so sweeping the blades shuts the bore like a camera.
const IRIS = {
  blades: 8, bore: 0.23, pivotR: 0.24, length: 0.42, width: 0.2, thickness: 0.02,
  frameR: 0.45, frameH: 0.15, bladeDrop: 0.07, boreDrop: 0.11, bladeStep: 0.005,
  plateT: 0.02, clearance: 0.015,
  // The bore is a throat rather than a painted-on disc, so a shape let go of
  // has somewhere to fall into and is taken by it a piece at a time. Narrow
  // enough to sit inside the ducting it feeds, which is what hides the rest of
  // the drop.
  throatR: 0.185, throatH: 0.28,
  betaShut: (179 * Math.PI) / 180,
  move: 0.06, hold: 0.05, lead: 0.06,
};
// Open stands the blade's chord off the axis by exactly the bore radius, so
// the aperture clears; shut lays it across the axis. Blade span and count are
// the smallest that leave no gap when shut.
IRIS.betaOpen = Math.PI - Math.asin(IRIS.bore / IRIS.pivotR);
const ITEM = { cube: 0.2, tetraEdge: 0.3, sphereR: 0.11, pitch: 0.24, lift: 0.005, exit: 1.2, catch: 0.3, sink: 0.175 };
const ITEM_HEIGHT = [ITEM.cube, ITEM.tetraEdge * Math.sqrt(2 / 3), ITEM.sphereR * 2];
// Widest horizontal reach of each shape: the cube's diagonal, the tetrahedron's
// base circumradius, the sphere's radius. Every iris plate is bored to the
// largest of them, so all three plates are interchangeable.
const ITEM_RADIUS = [
  (ITEM.cube * Math.SQRT2) / 2,
  ITEM.tetraEdge / Math.sqrt(3),
  ITEM.sphereR,
];
// Each shape's geometry has its origin at its base, because that is what a
// stack is built from. A falling body turns about its centre of mass, though,
// so the centre is what follows the trajectory and the base goes wherever the
// turn leaves it.
const ITEM_CENTRE = [ITEM.cube / 2, ITEM_HEIGHT[1] / 4, ITEM.sphereR];
const PLATE_BORE = Math.max(...ITEM_RADIUS);
const TRI_ANGLES = [Math.PI / 6, (5 * Math.PI) / 6, (3 * Math.PI) / 2];

const ISO_DIR = new THREE.Vector3(1, 1, 1).normalize();
const VIEW = ISO_DIR.clone().negate();
const UP = new THREE.Vector3(0, 1, 0);

const mod = (a, n) => ((a % n) + n) % n;
const clamp = (x, lo, hi) => Math.min(hi, Math.max(lo, x));
const clamp01 = (x) => clamp(x, 0, 1);
const easeInOut = (x) => (x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2);
const smooth = (x) => { x = clamp01(x); return x * x * (3 - 2 * x); };
// Smoothstep leaves a jump in acceleration at each end. The arm's own moves
// start and stop from rest, where that jump reads as a flinch, so they use a
// curve whose first and second derivatives both vanish at both ends.
const glide = (x) => { x = clamp01(x); return x * x * x * (x * (x * 6 - 15) + 10); };
// A body dropped from `height` above where it comes to rest: free fall, then a
// bounce to a fraction of its height each time until it stops. Both phases are
// closed form, so the whole settle is a pure function of the time since it was
// let go and can be read off at any point in the loop without integrating up
// to it, which is what keeps the scene seekable and the loop seamless.
function settle(height, t) {
  const g = CONFIG.gravity;
  if (height <= 0) return 0;
  if (t <= 0) return height;
  const first = Math.sqrt((2 * height) / g);
  if (t < first) return height - 0.5 * g * t * t;
  let tau = t - first;
  let v = Math.sqrt(2 * g * height) * CONFIG.restitution;
  while (v > 0.02) {
    const span = (2 * v) / g;
    if (tau < span) { const s = tau - span / 2; return (v * v) / (2 * g) - 0.5 * g * s * s; }
    tau -= span;
    v *= CONFIG.restitution;
  }
  return 0;
}
// How long that takes, so schedules are sized from the drop rather than the
// drop being cut to fit a schedule.
function settleTime(height) {
  const g = CONFIG.gravity;
  if (height <= 0) return 0;
  let t = Math.sqrt((2 * height) / g);
  let v = Math.sqrt(2 * g * height) * CONFIG.restitution;
  while (v > 0.02) { t += (2 * v) / g; v *= CONFIG.restitution; }
  return t;
}
// Boxes ride a hair above the slat tops. Landing them exactly on the slats
// makes the two surfaces coplanar, and each slat's top edge then draws
// straight through the box standing on it.
const BOX_Y = BELT.top + BOX.center + BOX.clear;

// Where the loop is: which cycle, and how far into it.
function cycleAt(t) {
  let index = CYCLES.length - 1;
  while (index > 0 && t < CYCLES[index].start) index--;
  return index;
}
// How far the arm has rolled the box it is holding: nothing before the turn,
// a quarter turn after it, whether or not the arm is still attached.
function rolled(u, cycle) {
  if (!cycle.entry.reject) return 0;
  const start = cycle.armStart + CONFIG.arm.descend + CONFIG.arm.grip;
  return Math.PI * glide(clamp01((u - start) / CONFIG.arm.turn));
}
// The arm's own pose: where the wrist is, how far the claw has rolled, and
// how tightly it is closed. It parks clear of the belt except on a rejected box.
function armPose(u, cycle) {
  // Straight in and straight back out, at working height throughout.
  const reach = (p) => ({ x: ARM.parkX + (ARM.wristX - ARM.parkX) * p, y: BOX_Y });
  const idle = { ...reach(0), roll: 0, grip: 0, lift: 0 };
  if (!cycle.entry.reject) return idle;
  const a = CONFIG.arm;
  let x = u - cycle.armStart;
  if (x <= 0) return idle;
  if (x < a.descend) return { ...reach(glide(x / a.descend)), roll: 0, grip: 0, lift: 0 };

  x -= a.descend;
  if (x < a.grip) return { ...reach(1), roll: 0, grip: smooth(x / a.grip), lift: 0 };
  x -= a.grip;
  const at = reach(1);
  if (x < a.turn) {
    // A hover through the turn: the arm picks the box up off the slats, rolls
    // it, and sets it back down. The lift is a function of the roll angle
    // rather than of time, so it is zero exactly when the box is square and
    // peaks exactly when the box is on its edge, and the whole flip is driven
    // by one curve instead of two that have to be kept in step. It has to be
    // steep enough at both ends to outrun the corner the box would otherwise
    // pivot on, which is what sets its size: half the box's own height.
    const roll = Math.PI * glide(x / a.turn);
    const lift = ARM.releaseLift * Math.sin(roll);
    return { x: at.x, y: at.y + lift, roll, grip: 1, lift };
  }
  x -= a.turn;
  // Level again, so it can let go and draw out at working height.
  if (x < a.release) return { ...at, roll: Math.PI, grip: 1 - smooth(x / a.release), lift: 0 };
  x -= a.release;
  // Draw straight out first, still turned and still a touch clear of the deck.
  // Only once the fingers are past the box can the hand unwind: turning back
  // any earlier would sweep them through the box it just set down.
  // Straight out, then unwind only once the fingers are right off the belt:
  // the spin swings them below the hand, and over the deck that would put one
  // through it.
  // It draws out still turned and does not wind back. The head is symmetric
  // about the roll axis, axle heads included, so a half turn maps it onto
  // itself: parked half turned is indistinguishable from parked square, and
  // the pose the next cycle starts from is the pose this one ends in. Winding
  // back instead meant spinning the head through half a turn in the last
  // fraction of the retract, which whipped, and the jaws had to be shut to do
  // it, so the claw came to rest closed and popped open at the cycle boundary.
  const back = reach(1 - glide(clamp01(x / a.retract)));
  return { x: back.x, y: back.y, roll: Math.PI, grip: 0, lift: 0 };
}

// Two-link solve for the shoulder and elbow that put the wrist on target. The
// positive branch swings the elbow away from the belt, clear of the boxes.
function armJoints(wx, wy) {
  const dx = wx - ARM.shoulder.x, dy = wy - ARM.shoulder.y;
  const d = Math.min(Math.hypot(dx, dy), ARM.upper + ARM.fore - 1e-3);
  const cos = clamp((d * d - ARM.upper * ARM.upper - ARM.fore * ARM.fore) / (2 * ARM.upper * ARM.fore), -1, 1);
  const bend = Math.acos(cos);
  const base = Math.atan2(dy, dx) - Math.atan2(ARM.fore * Math.sin(bend), ARM.upper + ARM.fore * Math.cos(bend));
  return { base, tip: base + bend };
}

// The Keynes wordmark, lifted from the site's navbar logo (apps/web/src/assets/
// logo.svg) and inlined so this file stays standalone. Only the filled glyph
// outlines are carried over; the source also draws them a second time as a
// hairline stroke, which at this size would only thicken the mark.

// ---------------------------------------------------------------- materials
const offset = { polygonOffset: true, polygonOffsetFactor: 1, polygonOffsetUnits: 1 };
const white = new THREE.MeshBasicMaterial({ color: 0xffffff, ...offset });
const black = new THREE.MeshBasicMaterial({ color: 0x111111 });
// Flipping the parsed shapes out of SVG's y-down space reverses their winding,
// so the mark is drawn from both sides, and it carries no polygon offset
// because it has to win against the plate it sits on.
const markMat = new THREE.MeshBasicMaterial({ color: 0x111111, side: THREE.DoubleSide });
// A hair of stroke round the mark, well under the hairline weight the mechanism
// detail uses. Enough to keep the script's thinnest strokes from dropping below
// a pixel; any heavier and it starts closing the counters, which is worse than
// leaving it plain.
markMat.line = new LineMaterial({ color: 0x111111, linewidth: CONFIG.markWidth });
const shell = new THREE.MeshBasicMaterial({ color: 0xffffff, side: THREE.DoubleSide, ...offset });
const glass = new THREE.MeshBasicMaterial({ color: 0x9fbfe0, transparent: true, opacity: 0.14, depthWrite: false, ...offset });
const lampMat = new THREE.MeshBasicMaterial({ color: CONFIG.lampColors.running, ...offset });
// Unlit, like everything else in the scene. Nothing here shades: it is line
// work, and a surface that takes a light is a surface pretending to have been
// photographed.
const shapeMats = CONFIG.shapeColors.map((color) => new THREE.MeshBasicMaterial({ color, side: THREE.DoubleSide, ...offset }));
const lineMat = new LineMaterial({ color: 0x111111, linewidth: CONFIG.lineWidth });
// Hairline weight for mechanism detail. At 512px a bolt head is only a few
// pixels across, so the structural line weight fills it in solid.
const fineMat = new LineMaterial({ color: 0x111111, linewidth: CONFIG.fineWidth });

// ---------------------------------------------------------------- helpers
function segments(positions, material = lineMat) {
  const geometry = new LineSegmentsGeometry().setPositions(positions);
  return new LineSegments2(geometry, material);
}
// Redraw an object's outlines at hairline weight.
function thin(object) {
  object.traverse((o) => { if (o.isLineSegments2) o.material = fineMat; });
  return object;
}
function edgeLines(geometry, threshold = 1) {
  const edges = new THREE.EdgesGeometry(geometry, threshold);
  const lines = segments(edges.attributes.position.array);
  edges.dispose();
  return lines;
}
function solid(geometry, material = white, threshold = 1) {
  const group = new THREE.Group();
  group.add(new THREE.Mesh(geometry, material));
  group.add(edgeLines(geometry, threshold));
  return group;
}
// Silhouette lines of a (truncated) cylinder between two points, for the fixed camera.
function silhouette(p0, r0, p1, r1) {
  const axis = p1.clone().sub(p0).normalize();
  const side = new THREE.Vector3().crossVectors(axis, VIEW).normalize();
  const a0 = p0.clone().addScaledVector(side, r0), a1 = p1.clone().addScaledVector(side, r1);
  const b0 = p0.clone().addScaledVector(side, -r0), b1 = p1.clone().addScaledVector(side, -r1);
  return segments([a0.x, a0.y, a0.z, a1.x, a1.y, a1.z, b0.x, b0.y, b0.z, b1.x, b1.y, b1.z]);
}
// Outline circle of a sphere as seen by the fixed camera.
function sphereSilhouette(r, center) {
  const u = new THREE.Vector3().crossVectors(VIEW, UP).normalize();
  const v = new THREE.Vector3().crossVectors(VIEW, u).normalize();
  const n = 36, pts = [];
  for (let i = 0; i < n; i++) {
    for (const a of [(i / n) * Math.PI * 2, ((i + 1) / n) * Math.PI * 2]) {
      const p = center.clone().addScaledVector(u, r * Math.cos(a)).addScaledVector(v, r * Math.sin(a));
      pts.push(p.x, p.y, p.z);
    }
  }
  return segments(pts);
}
function box(sx, sy, sz, x, y, z) {
  const g = solid(new THREE.BoxGeometry(sx, sy, sz));
  g.position.set(x, y, z);
  return g;
}
// Glass pipe between two world points: tinted body, end rims, silhouette lines.
function glassPipe(p0, p1, r, open = false) {
  const g = new THREE.Group();
  const dir = p1.clone().sub(p0);
  const len = dir.length();
  dir.normalize();
  const geo = new THREE.CylinderGeometry(r, r, len, 32, 1, open);
  const mesh = new THREE.Mesh(geo, glass);
  mesh.renderOrder = 5;
  const rims = edgeLines(geo, 30);
  for (const o of [mesh, rims]) {
    o.position.copy(p0).lerp(p1, 0.5);
    o.quaternion.setFromUnitVectors(UP, dir);
    g.add(o);
  }
  g.add(silhouette(p0, r, p1, r));
  return g;
}

// ---------------------------------------------------------------- ducting
// Opaque sheet-metal fittings. Swept solids are outlined by their silhouette
// against the fixed camera, since edge extraction on a swept tube yields
// unusable clutter. Rings drawn on a duct keep only the camera-facing half,
// so a rib never shows through the far wall.
function addRun(pts, run) {
  for (let i = 0; i < run.length - 1; i++) pts.push(run[i].x, run[i].y, run[i].z, run[i + 1].x, run[i + 1].y, run[i + 1].z);
}
function frontRing(pts, centre, axis, r, steps = 32) {
  const u = new THREE.Vector3().crossVectors(axis, VIEW).normalize();
  const v = new THREE.Vector3().crossVectors(axis, u).normalize();
  let run = [];
  for (let j = 0; j <= steps; j++) {
    const a = (j / steps) * Math.PI * 2;
    const n = u.clone().multiplyScalar(Math.cos(a)).addScaledVector(v, Math.sin(a));
    if (n.dot(VIEW) > 0) { addRun(pts, run); run = []; continue; }
    run.push(centre.clone().addScaledVector(n, r));
  }
  addRun(pts, run);

  }
  nozzle.scale.set(1 + 0.12 * pulse, 1, 1 + 0.12 * pulse);

  // Lamp: amber while the belt is running, then the verdict on the box that has
  // arrived. One state per box, held solid, rather than a flash per shape.
  let colour = CONFIG.lampColors.running;
  if (u >= CONFIG.phase.travel) colour = u < cycle.approved ? CONFIG.lampColors.denied : CONFIG.lampColors.approved;
  lampMat.color.set(colour);
}

// ---------------------------------------------------------------- loop, resize, visibility
const reducedMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
// The frame to hold when motion is turned off: mid-drop on the first box.
const STILL = CYCLES[0].start + CYCLES[0].dropStart + 0.7;
let running = false, last = 0, elapsed = 0;

function render() { renderer.render(scene, camera); }
function frame(now) {
  if (!running) return;
  elapsed += Math.min(now - last, 100) / 1000;
  last = now;
  update(elapsed % LOOP);
  render();
  requestAnimationFrame(frame);
}
function start() {
  if (running || reducedMotion) return;
  running = true;
  last = performance.now();
  requestAnimationFrame(frame);
}
function stop() { running = false; }
function seek(t) { stop(); elapsed = t; update(mod(t, LOOP)); render(); }
// Handles for inspection. Nothing here may collide with a config key: an
// exposed `arm` would overwrite the arm's own timings.
Object.assign(CONFIG, {
  loop: LOOP, cycles: CYCLES, seek, start, stop,
  parts: { scene, boxes, armUpper, armFore, armWrist, armRotor, armJaws },
});

function resize() {
  const size = Math.max(1, Math.round(container.clientWidth));
  const dpr = Math.min(window.devicePixelRatio || 1, CONFIG.maxPixelRatio);
  renderer.setPixelRatio(dpr);
  renderer.setSize(size, size, false);
  for (const [mat, width] of [[lineMat, CONFIG.lineWidth], [fineMat, CONFIG.fineWidth], [markMat.line, CONFIG.markWidth]]) {
    mat.resolution.set(size * dpr, size * dpr);
    mat.linewidth = width * dpr;
  }
  if (!running) { update(reducedMotion ? STILL : elapsed % LOOP); render(); }
}
new ResizeObserver(resize).observe(container);
resize();

if (reducedMotion) {
  update(STILL);
  render();
} else {
  new IntersectionObserver((entries) => {
    entries.some((e) => e.isIntersecting) ? start() : stop();
  }).observe(container);
}
</script>
</body>
</html>
