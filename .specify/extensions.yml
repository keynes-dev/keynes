installed: []
settings:
  auto_execute_hooks: true
hooks:
  before_constitution:
    - extension: git
      command: speckit.git.initialize
      enabled: true
      optional: false
      prompt: Execute speckit.git.initialize?
      description: Initialize Git repository before constitution setup
      condition: null
  before_specify:
    - extension: git
      command: speckit.git.feature
      enabled: true
      optional: false
      prompt: Execute speckit.git.feature?
      description: Bind a Linear issue and create its feature branch before specification
      condition: null
  after_constitution:
    - extension: git
      command: speckit.git.commit
      enabled: true
      optional: true
      prompt: Commit constitution changes?
      description: Auto-commit after constitution update
      condition: null
  after_specify:
    - extension: git
      command: speckit.git.publish
      enabled: true
      optional: false
      prompt: Publish scoped planning documents and Linear links?
      description: Publish scoped documents to the planning or selected issue PR
      condition: null
  after_clarify:
    - extension: git
      command: speckit.git.publish
      enabled: true
      optional: false
      prompt: Publish scoped planning documents and Linear links?
      description: Publish scoped documents to the planning or selected issue PR
      condition: null
  after_plan:
    - extension: git
      command: speckit.git.publish
      enabled: true
      optional: false
      prompt: Publish scoped planning documents and Linear links?
      description: Publish scoped documents to the planning or selected issue PR
      condition: null
  after_tasks:
    - extension: git
      command: speckit.git.publish
      enabled: true
      optional: false
      prompt: Publish scoped planning documents and Linear links?
      description: Publish scoped documents to the planning or selected issue PR
      condition: null
  after_implement:
    - extension: git
      command: speckit.git.commit
      enabled: true
      optional: true
      prompt: Commit implementation changes?
      description: Auto-commit after implementation
      condition: null
  after_checklist:
    - extension: git
      command: speckit.git.publish
      enabled: true
      optional: false
      prompt: Publish scoped planning documents and Linear links?
      description: Publish scoped documents to the planning or selected issue PR
      condition: null
  after_taskstoissues:
    - extension: git
      command: speckit.git.publish
      enabled: true
      optional: false
      prompt: Publish scoped planning documents and Linear links?
      description: Publish scoped documents to the planning or selected issue PR
      condition: null
