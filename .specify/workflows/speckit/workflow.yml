schema_version: "1.0"
workflow:
  id: "speckit"
  name: "Full SDD Cycle"
  version: "1.0.0"
  author: "GitHub"
  description: "Uses one Linear feature issue, reviewable phases, published sub-issues, and one GitHub PR stack"

requires:
  speckit_version: ">=0.7.2"
  integrations:
    any: ["copilot", "claude", "gemini"]

inputs:
  spec:
    type: string
    required: true
    prompt: "Describe what you want to build"
  integration:
    type: string
    default: "copilot"
    prompt: "Integration to use (e.g. claude, copilot, gemini)"
  scope:
    type: string
    default: "full"
    enum: ["full", "backend-only", "frontend-only"]

steps:
  - id: specify
    command: speckit.specify
    integration: "{{ inputs.integration }}"
    input:
      args: "{{ inputs.spec }}"

  - id: review-spec
    type: gate
    message: "Review the generated spec before planning."
    options: [approve, reject]
    on_reject: abort

  - id: plan
    command: speckit.plan
    integration: "{{ inputs.integration }}"
    input:
      args: "{{ inputs.spec }}"

  - id: review-plan
    type: gate
    message: "Review the plan before generating tasks."
    options: [approve, reject]
    on_reject: abort

  - id: tasks
    command: speckit.tasks
    integration: "{{ inputs.integration }}"
    input:
      args: "{{ inputs.spec }}"

  - id: analyze
    command: speckit.analyze
    integration: "{{ inputs.integration }}"
    input:
      args: "{{ inputs.spec }}"

  - id: review-tasks
    type: gate
    message: "Review the task coverage, phase boundaries, dependencies, bindings, and checkpoints."
    options: [approve, reject]
    on_reject: abort

  - id: preview-phase-issues
    command: speckit.taskstoissues
    integration: "{{ inputs.integration }}"
    input:
      args: ""

  - id: approve-phase-publication
    type: gate
    message: "Approve the exact Linear sub-issues and blocker relationships in the preview."
    options: [approve, reject]
    on_reject: abort

  - id: publish-phase-issues
    command: speckit.taskstoissues
    integration: "{{ inputs.integration }}"
    input:
      args: "--apply"

  - id: implement
    command: speckit.implement
    integration: "{{ inputs.integration }}"
    input:
      args: "{{ inputs.spec }}"
