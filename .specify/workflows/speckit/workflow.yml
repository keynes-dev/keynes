schema_version: "1.0"
workflow:
  id: "speckit"
  name: "Full SDD Cycle"
  version: "2.0.0"
  author: "GitHub"
  description: "Uses one Linear issue and branch for the full lifecycle and independent feature acceptance"

requires:
  speckit_version: ">=0.7.2"
  integrations:
    any: ["codex", "copilot", "claude", "gemini"]

inputs:
  spec:
    type: string
    required: true
    prompt: "Describe what you want to build"
  integration:
    type: string
    default: "codex"
    prompt: "Integration to use (e.g. codex, claude, copilot, gemini)"
  scope:
    type: string
    default: "full"
    enum: ["full", "backend-only", "frontend-only"]

steps:
  - id: specify
    command: speckit.specify
    integration: "{{ inputs.integration }}"
    input:
      args: "{{ inputs.spec }}"

  - id: review-spec
    type: gate
    message: "Review the specification before planning; resolve material ambiguities with speckit.clarify when needed."
    options: [approve, reject]
    on_reject: abort

  - id: plan
    command: speckit.plan
    integration: "{{ inputs.integration }}"
    input:
      args: "{{ inputs.spec }}"

  - id: review-plan
    type: gate
    message: "Review the plan before generating tasks."
    options: [approve, reject]
    on_reject: abort

  - id: tasks
    command: speckit.tasks
    integration: "{{ inputs.integration }}"
    input:
      args: "{{ inputs.spec }}"

  - id: analyze
    command: speckit.analyze
    integration: "{{ inputs.integration }}"
    input:
      args: "{{ inputs.spec }}"

  - id: review-tasks
    type: gate
    message: "Review one acceptance outcome, landed prerequisites, task coverage, checkpoints, and shared-runtime evidence."
    options: [approve, reject]
    on_reject: abort

  - id: implement
    command: speckit.implement
    integration: "{{ inputs.integration }}"
    input:
      args: "{{ inputs.spec }}"

  - id: review-implementation
    type: gate
    message: "Review the independent feature diff and required verification results."
    options: [approve, reject]
    on_reject: abort

  - id: accept-feature
    type: gate
    message: "Confirm merge and required acceptance evidence before marking the Linear issue Done. This step does not merge or publish."
    options: [approve, reject]
    on_reject: abort
