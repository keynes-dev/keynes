schema_version: "1.0"

extension:
  id: git
  name: "Git Branching Workflow"
  version: "1.0.0"
  description: "Linear-native Keynes identity, issue PRs, branch validation, and Git remote detection"
  author: spec-kit-core
  repository: https://github.com/github/spec-kit
  license: MIT

requires:
  speckit_version: ">=0.2.0"
  tools:
    - name: git
      required: false

provides:
  commands:
    - name: speckit.git.feature
      file: commands/speckit.git.feature.md
      description: "Create a feature with the exact branch returned by Linear"
    - name: speckit.git.validate
      file: commands/speckit.git.validate.md
      description: "Validate the branch, feature artifacts, and Linear issue reference"
    - name: speckit.git.remote
      file: commands/speckit.git.remote.md
      description: "Detect Git remote URL for GitHub integration"
    - name: speckit.git.initialize
      file: commands/speckit.git.initialize.md
      description: "Initialize a Git repository with an initial commit"
    - name: speckit.git.commit
      file: commands/speckit.git.commit.md
      description: "Auto-commit changes after a Spec Kit command completes"
    - name: speckit.git.stack
      file: commands/speckit.git.stack.md
      description: "Manage the GitHub PR stack from recorded issue branches"

    - name: speckit.git.publish
      file: commands/speckit.git.publish.md
      description: "Publish planning documents early and synchronize Linear links"

  config:
    - name: "git-config.yml"
      template: "config-template.yml"
      description: "Git branching configuration"
      required: false

hooks:
  before_constitution:
    command: speckit.git.initialize
    optional: false
    description: "Initialize Git repository before constitution setup"
  before_specify:
    command: speckit.git.feature
    optional: false
    description: "Bind a Linear issue and create its feature branch before specification"
  after_constitution:
    command: speckit.git.commit
    optional: true
    prompt: "Commit constitution changes?"
    description: "Auto-commit after constitution update"
  after_specify:
    command: speckit.git.publish
    optional: false
    prompt: Publish scoped planning documents and Linear links?
    description: Publish scoped documents to the planning or selected issue PR
  after_clarify:
    command: speckit.git.publish
    optional: false
    prompt: Publish scoped planning documents and Linear links?
    description: Publish scoped documents to the planning or selected issue PR
  after_plan:
    command: speckit.git.publish
    optional: false
    prompt: Publish scoped planning documents and Linear links?
    description: Publish scoped documents to the planning or selected issue PR
  after_tasks:
    command: speckit.git.publish
    optional: false
    prompt: Publish scoped planning documents and Linear links?
    description: Publish scoped documents to the planning or selected issue PR
  after_implement:
    command: speckit.git.commit
    optional: true
    prompt: "Commit implementation changes?"
    description: "Auto-commit after implementation"
  after_checklist:
    command: speckit.git.publish
    optional: false
    prompt: Publish scoped planning documents and Linear links?
    description: Publish scoped documents to the planning or selected issue PR
  after_taskstoissues:
    command: speckit.git.publish
    optional: false
    prompt: Publish scoped planning documents and Linear links?
    description: Publish scoped documents to the planning or selected issue PR

tags:
  - "git"
  - "stacked-prs"
  - "workflow"

config:
  defaults:
    branch_source: linear
    init_commit_message: "[Spec Kit] Initial commit"
