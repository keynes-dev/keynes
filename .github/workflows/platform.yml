name: Platform

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  RECORD_PATH: artifacts/platform/feat-0009-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}.json

jobs:
  platform:
    name: Platform
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 11.21.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version-file: package.json
          check-latest: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Test platform
        run: pnpm test:platform -- --output "${{ env.RECORD_PATH }}"

      - name: Retain platform acceptance record
        if: success()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: platform-acceptance-record
          path: ${{ env.RECORD_PATH }}
          if-no-files-found: error
          retention-days: 14
