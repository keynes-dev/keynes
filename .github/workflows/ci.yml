name: CI

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  changes:
    name: Classify changes
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      disposition: ${{ steps.relevance.outputs.disposition }}
      run_databases: ${{ steps.relevance.outputs.run_databases }}
    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version-file: package.json
          check-latest: false
          package-manager-cache: false

      - name: Classify relevance
        id: relevance
        run: node scripts/classify-sqlite-postgres-changes.ts

  checks:
    name: Repository and tests
    needs: changes
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Require explicit relevance decision
        env:
          CLASSIFICATION: ${{ needs.changes.result }}
          DISPOSITION: ${{ needs.changes.outputs.disposition }}
          RUN_DATABASES: ${{ needs.changes.outputs.run_databases }}
        run: |
          case "$CLASSIFICATION/$RUN_DATABASES/$DISPOSITION" in
            success/true/relevant | success/false/not-applicable) ;;
            *) exit 1 ;;
          esac

      - name: Check out repository
        if: ${{ success() && !cancelled() }}
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Set up pnpm
        if: ${{ success() && !cancelled() }}
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 11.21.0
          run_install: false

      - name: Set up Node.js
        if: ${{ success() && !cancelled() }}
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version-file: package.json
          check-latest: false
          cache: pnpm

      - name: Install dependencies
        if: ${{ success() && !cancelled() }}
        run: pnpm install --frozen-lockfile

      - name: Check documentation formatting
        if: ${{ success() && !cancelled() && needs.changes.outputs.run_databases == 'false' }}
        run: pnpm format:docs

      - name: Run repository checks and tests
        if: ${{ success() && !cancelled() && needs.changes.outputs.run_databases == 'true' }}
        run: pnpm test:pr

  sqlite-postgres:
    name: SQLite and PostgreSQL behavior tests
    needs: changes
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Require explicit relevance decision
        env:
          CLASSIFICATION: ${{ needs.changes.result }}
          DISPOSITION: ${{ needs.changes.outputs.disposition }}
          RUN_DATABASES: ${{ needs.changes.outputs.run_databases }}
        run: |
          case "$CLASSIFICATION/$RUN_DATABASES/$DISPOSITION" in
            success/true/relevant | success/false/not-applicable) ;;
            *) exit 1 ;;
          esac

      - name: Check out repository
        if: ${{ success() && !cancelled() && needs.changes.outputs.run_databases == 'true' }}
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Set up pnpm
        if: ${{ success() && !cancelled() && needs.changes.outputs.run_databases == 'true' }}
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 11.21.0
          run_install: false

      - name: Set up Node.js
        if: ${{ success() && !cancelled() && needs.changes.outputs.run_databases == 'true' }}
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version-file: package.json
          check-latest: false
          cache: pnpm

      - name: Install dependencies
        if: ${{ success() && !cancelled() && needs.changes.outputs.run_databases == 'true' }}
        run: pnpm install --frozen-lockfile

      - name: Run native PostgreSQL correctness
        if: ${{ success() && !cancelled() && needs.changes.outputs.run_databases == 'true' }}
        run: pnpm test:ci:postgresql -- --diagnostics "$RUNNER_TEMP/ci/postgresql.json"

      - name: Retain failure diagnostics
        if: ${{ failure() && !cancelled() && needs.changes.outputs.run_databases == 'true' }}
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: postgresql-failure-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/ci/postgresql.json
          if-no-files-found: ignore
          retention-days: 7
