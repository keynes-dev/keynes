name: CI

on:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    name: Repository and tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 11.21.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version-file: package.json
          check-latest: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run repository checks and tests
        run: pnpm test:pr

  sqlite-postgres:
    name: SQLite and PostgreSQL behavior tests
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 24
          check-latest: false

      - name: Classify SQLite and PostgreSQL relevance
        id: relevance
        run: node scripts/classify-sqlite-postgres-changes.ts

      - name: Require explicit relevance decision
        env:
          DISPOSITION: ${{ steps.relevance.outputs.disposition }}
          RUN_DATABASES: ${{ steps.relevance.outputs.run_databases }}
        run: |
          case "$RUN_DATABASES/$DISPOSITION" in
            true/relevant | false/not-applicable) ;;
            *) exit 1 ;;
          esac

      - name: Set up pnpm
        if: steps.relevance.outputs.run_databases == 'true'
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 11.21.0
          run_install: false

      - name: Install dependencies
        if: steps.relevance.outputs.run_databases == 'true'
        run: pnpm install --frozen-lockfile

      - name: Run SQLite and PostgreSQL behavior tests
        if: steps.relevance.outputs.run_databases == 'true'
        run: pnpm test:sqlite-postgres -- --output "$RUNNER_TEMP/sqlite-postgres"

      - name: Retain SQLite and PostgreSQL evidence
        id: upload
        if: ${{ always() && steps.relevance.outputs.run_databases == 'true' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: sqlite-postgres-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}
          path: |
            ${{ runner.temp }}/sqlite-postgres/manifest.json
            ${{ runner.temp }}/sqlite-postgres/sqlite.vitest.json
            ${{ runner.temp }}/sqlite-postgres/postgresql.json
            ${{ runner.temp }}/sqlite-postgres/postgresql.json.vitest.json
            ${{ runner.temp }}/sqlite-postgres/postgresql.json.observations.json
          if-no-files-found: error
          overwrite: false
          retention-days: 14

      - name: Confirm artifact retention
        if: ${{ always() && steps.relevance.outputs.run_databases == 'true' }}
        env:
          ARTIFACT_ID: ${{ steps.upload.outputs.artifact-id }}
          ARTIFACT_DIGEST: ${{ steps.upload.outputs.artifact-digest }}
        run: |
          [[ "$ARTIFACT_ID" =~ ^[0-9]+$ ]] || exit 1
          [[ "$ARTIFACT_DIGEST" =~ ^[0-9a-fA-F]{64}$ ]] || exit 1
          printf 'SQLite and PostgreSQL artifact ID: `%s`\n\nSHA-256: `%s`\n' "$ARTIFACT_ID" "$ARTIFACT_DIGEST" >> "$GITHUB_STEP_SUMMARY"
