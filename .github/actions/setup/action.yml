name: Workspace setup
description: Install the pinned workspace dependencies and restore compatible Turbo tasks
inputs:
  node-version:
    description: Optional compatibility-matrix Node version
    default: ""
runs:
  using: composite
  steps:
    - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
      with:
        version: 11.21.0
        run_install: false
    - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
      with:
        node-version: ${{ inputs.node-version }}
        node-version-file: package.json
        check-latest: false
        cache: pnpm
    - id: node
      shell: bash
      run: echo "version=$(node --version)" >> "$GITHUB_OUTPUT"
    - id: turbo
      uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
      with:
        path: .turbo
        key: turbo-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.node.outputs.version }}-${{ hashFiles('pnpm-lock.yaml', 'turbo.json', '.github/actions/setup/action.yml') }}-${{ github.sha }}-${{ github.job }}
        restore-keys: |
          turbo-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.node.outputs.version }}-${{ hashFiles('pnpm-lock.yaml', 'turbo.json', '.github/actions/setup/action.yml') }}-
    - shell: bash
      run: pnpm install --frozen-lockfile
    - shell: bash
      env:
        CACHE_HIT: ${{ steps.turbo.outputs.cache-hit }}
      run: |
        printf 'Node: `%s`\n\nTurbo exact-key match: `%s`. Compatible restores and cache saves are reported by the cache action.\n' "$(node --version)" "${CACHE_HIT:-miss}" >> "$GITHUB_STEP_SUMMARY"
